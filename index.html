<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pagina di test per verificare il deploy da GitHub a Vercel." />
  <title>Test Deploy Vercel</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 5%, #23365e, #0b1020 55%); color: #f7f9ff; }
    main { width: min(100%, 480px); padding: 42px 32px; text-align: center; background: #ffffff0d; border: 1px solid #ffffff26; border-radius: 22px; box-shadow: 0 24px 70px #0006; }
    .icon { font-size: 50px; margin-bottom: 12px; }
    h1 { margin: 0 0 14px; font-size: clamp(26px, 5vw, 34px); }
    p { color: #bfc8df; line-height: 1.6; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; margin: 14px 0 24px; border-radius: 100px; background: #16a34a22; color: #86efac; font-size: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; }
    button { background: #f8fafc; color: #111827; padding: 12px 20px; border: 0; border-radius: 11px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #dbeafe; }
    #result { min-height: 25px; margin-top: 20px; color: #93c5fd; }
    footer { margin-top: 18px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🚀</div>
    <h1>Deploy riuscito!</h1>
    <p>Se stai vedendo questa pagina, il sito pubblicato da GitHub a Vercel funziona correttamente.</p>
    <div class="status"><span class="dot"></span> Sito online</div>
    <div><button id="testButton" type="button">Testa JavaScript</button></div>
    <p id="result" role="status" aria-live="polite"></p>
    <footer>Pagina di test · GitHub + Vercel</footer>
  </main>
  <script>
    document.getElementById('testButton').addEventListener('click', () => {
      document.getElementById('result').textContent = '✅ Anche JavaScript funziona!';
    });
  </script>
</body>
</html>
